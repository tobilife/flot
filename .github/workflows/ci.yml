name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Byte-exact sources: fixtures and recorded output are digested.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - id: rust
        name: The toolchain rust-toolchain.toml pins
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # This repository's own gate, through its own action.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - id: rust
        name: The toolchain rust-toolchain.toml pins
        shell: bash
        run: echo "toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build && echo "$PWD/target/debug" >> "$GITHUB_PATH"
      # Runs a trusted developer signed and pushed are reused, not executed
      # again. The signers come from the base branch: a pull request must not
      # choose whom CI trusts.
      - name: Trust the signers on the base branch and pull their runs
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          rev=HEAD
          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
            rev="origin/$BASE"
          fi
          if ! signers=$(git show "$rev:.github/flot-signers"); then
            echo "::notice::no .github/flot-signers on $rev; every step runs here"
            exit 0
          fi
          printf '%s\n' "$signers" | while read -r name key; do
            case "$name" in ''|'#'*) continue ;; esac
            flot trust add "$name" "$key"
          done
          flot pull --require-trusted || echo "::notice::flot pull refused some runs; their steps run here instead"
      - uses: ./
        with:
          version: path

  msrv:
    runs-on: ubuntu-latest
    env:
      # Over rust-toolchain.toml, which pins the toolchain the gate uses.
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
