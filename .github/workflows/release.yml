name: release

# A pushed tag `vX.Y.Z` builds binaries, publishes them on a GitHub release
# with notes from CHANGELOG.md, and publishes the crate to crates.io through
# trusted publishing. Running the workflow by hand only builds the binaries.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag names the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi
      - name: CHANGELOG.md has a section for the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "^## ${GITHUB_REF_NAME#v}\$" CHANGELOG.md
      - run: cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # The archives carry README.md and LICENSE as committed.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="flot-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/flot.exe" "$name/"
            archive="$name.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/flot" "$name/"
            archive="$name.tar.gz"
            tar czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - name: The binary runs
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: target/${{ matrix.target }}/release/flot --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            flot-*.tar.gz*
            flot-*.zip*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          printf '\n```bash\ncargo install flot-cli\n```\n' >> notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "flot ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
