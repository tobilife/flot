[package]
name = "flot-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Verifiable agent flow runtime: every step emits a content-addressed receipt, every claim is bound to evidence."
license = "MIT"
repository = "https://github.com/tobilife/flot"
readme = "README.md"
keywords = ["agent", "workflow", "verification", "mcp", "provenance"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "flot"
path = "src/lib.rs"

[[bin]]
name = "flot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
getrandom = "0.4"
glob = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
