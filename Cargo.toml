[package]
name = "flot-cli"
version = "0.2.11"
edition = "2021"
rust-version = "1.88"
description = "Verifiable agent flow runtime: every step emits a content-addressed receipt, every claim is bound to evidence."
license = "MIT"
repository = "https://github.com/tobilife/flot"
readme = "README.md"
# Pins this repository's own toolchain; a crate built by `cargo install`
# needs only `rust-version`.
exclude = ["rust-toolchain.toml"]
keywords = ["agent", "workflow", "verification", "mcp", "provenance"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "flot"
path = "src/lib.rs"

[[bin]]
name = "flot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
getrandom = "0.4"
glob = "0.3"
hex = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
