# Driving a coding agent through a change of a Rust repository.
#
# The agent's own confidence is irrelevant: a claim only becomes `verified` when
# its proof command exits zero. Flags are Claude Code's (tested with 2.1.330);
# another agent CLI needs its own non-interactive and file-permission flags.
# For a small end-to-end flow that has actually been run, see examples/slugify.
#
# Paths and the store are relative to the flow file's directory, so put this
# flow at the repository root:
#
#   cp examples/agent-review.toml agent.toml
#   flot -f agent.toml plan && flot -f agent.toml run
#
# Agent steps remove their artifact first, report spend even when the agent
# fails, and then exit with the agent's status. A claim judged by an agent
# (here, the review) is re-rolled on every run until it verifies, because only
# settled receipts are reused.

[flow]
name = "agent-review"
description = "Spec, implement and review a change with agent CLIs under receipts."
budget = { timeout_secs = 1800, max_inline_bytes = 8192 }
# Stop starting agent steps once reported spend reaches $5. Steps that report
# nothing are listed as silent, because the ceiling cannot see them.
max_cost_usd = 5.0

[[step]]
id = "spec"
run = """
mkdir -p .flot-work
rm -f .flot-work/spec.md
status=0
claude -p "Read src/ and write .flot-work/spec.md: the smallest change that adds $TASK, with acceptance criteria as shell commands. Write no other file." \
  --permission-mode acceptEdits --output-format json > .flot-work/spec.json || status=$?
jq '{input_tokens: (.usage.input_tokens + .usage.cache_read_input_tokens + .usage.cache_creation_input_tokens),
     output_tokens: .usage.output_tokens, cost_usd: .total_cost_usd}' .flot-work/spec.json > "$FLOT_METRICS" || true
exit "$status"
"""
# The task keys the spec, not the tree: `implement` rewrites src/, and keying
# the spec on src/ would write a new spec, and a new implementation, on every
# run. flot names the trade-off as a limitation (no declared inputs).
env = { TASK = "an --only flag to the plan command" }
outputs = [".flot-work/spec.md"]
claims = ["a spec with acceptance criteria exists"]
# A written file is checkable; an agent's summary of it is not.
verify = "test -s .flot-work/spec.md && grep -qi 'acceptance' .flot-work/spec.md"

[[step]]
id = "implement"
run = """
mkdir -p .flot-work
status=0
claude -p "Implement .flot-work/spec.md. Change code under src/ only; do not touch tests." \
  --permission-mode acceptEdits --output-format json > .flot-work/implement.json || status=$?
jq '{input_tokens: (.usage.input_tokens + .usage.cache_read_input_tokens + .usage.cache_creation_input_tokens),
     output_tokens: .usage.output_tokens, cost_usd: .total_cost_usd}' .flot-work/implement.json > "$FLOT_METRICS" || true
exit "$status"
"""
needs = ["spec"]
# Only what the agent is told to do. src/ is what it changes, not what it reads
# as instructions: keying on it would re-run the agent after every edit it made.
inputs = [".flot-work/spec.md"]
claims = [
  "the workspace compiles after the agent's edits",
  "the existing suite passes, with the tests left as they were",
]
verify = "cargo build --all-targets --quiet && cargo test --quiet"
# The tests are the proof. If the agent edits them to pass, the claims cannot
# verify; if a person changes them, the claims are re-proved.
verify_inputs = ["tests/**/*.rs"]

[[step]]
id = "review"
run = """
mkdir -p .flot-work
rm -f .flot-work/review.md
status=0
claude -p "Review the working tree diff for leftover placeholders, dead code and unhandled errors. Write findings to .flot-work/review.md. Do not edit code." \
  --permission-mode acceptEdits --output-format json > .flot-work/review.json || status=$?
jq '{input_tokens: (.usage.input_tokens + .usage.cache_read_input_tokens + .usage.cache_creation_input_tokens),
     output_tokens: .usage.output_tokens, cost_usd: .total_cost_usd}' .flot-work/review.json > "$FLOT_METRICS" || true
exit "$status"
"""
needs = ["implement"]
inputs = ["src/**/*.rs"]
outputs = [".flot-work/review.md"]
claims = [
  "the review is recorded",
  "no placeholder markers remain in the source",
]
verify = "test -s .flot-work/review.md && ! grep -rn 'TODO\\|FIXME\\|unimplemented!' src/"

# Nothing above publishes anything. Release stays a separate, explicitly
# authorized flow, so a green review cannot push by accident.
