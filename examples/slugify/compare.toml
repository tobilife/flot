# Two agents implement the same spec, each in its own copy of the project;
# the acceptance check proves each one, and flot keeps the cheapest that
# passed and writes its slug.py back.
#
#   cd examples/slugify && flot run -f compare.toml
#
# Needs `claude` (Claude Code; tested with 2.1.330), `codex` (Codex CLI;
# tested with 0.172.0) and `jq`. Set CODEX_MODEL to choose Codex's model.
#
# Claude reports a dollar cost; Codex on a ChatGPT plan reports tokens only,
# so its cost is unknown, and a candidate with a known cost ranks before one
# without. Claude is denied the check file; Codex's sandbox lets it read the
# workspace, so it can see the check.

[flow]
name = "slugify-compare"
description = "Claude Code and Codex implement SPEC.md apart; check_slug.py proves each."
max_cost_usd = 4.0
budget = { timeout_secs = 600, max_inline_bytes = 2048 }

[[step]]
id = "implement"
candidates = ["claude", "codex"]
attempts = 2
run = """
mkdir -p .flot-work
# Each candidate's copy holds the project as it is, slug.py included; start
# every candidate from the spec alone, and later attempts from what it left.
if [ "$FLOT_ATTEMPT" = 1 ]; then rm -f slug.py; fi
status=0
prompt="Implement SPEC.md as slug.py. Create or edit only slug.py; do not write tests or other files."
if [ -n "${FLOT_FEEDBACK:-}" ]; then
  prompt="$prompt

Your previous attempt did not pass the acceptance check. What flot recorded about it:
$(cat "$FLOT_FEEDBACK")"
fi
case "$FLOT_CANDIDATE" in
claude)
  claude -p "$prompt" \
    --setting-sources project --strict-mcp-config --tools Read,Edit,Write \
    --disallowedTools "Read(./check_slug.py)" "Edit(./check_slug.py)" "Write(./check_slug.py)" \
    --permission-mode acceptEdits --max-budget-usd 1.5 --output-format json > .flot-work/claude.json || status=$?
  jq '{input_tokens: (.usage.input_tokens + .usage.cache_read_input_tokens + .usage.cache_creation_input_tokens),
       output_tokens: .usage.output_tokens, cost_usd: .total_cost_usd}' .flot-work/claude.json > "$FLOT_METRICS" || true
  jq -r .result .flot-work/claude.json || true
  ;;
codex)
  codex exec --ignore-user-config --ephemeral --skip-git-repo-check -s workspace-write \
    ${CODEX_MODEL:+-m "$CODEX_MODEL"} --json -o .flot-work/codex.txt "$prompt" \
    < /dev/null > .flot-work/codex.jsonl || status=$?
  jq -s '[.[] | select(.type == "turn.completed") | .usage]
         | {input_tokens: (map(.input_tokens) | add), output_tokens: (map(.output_tokens) | add)}' \
    .flot-work/codex.jsonl > "$FLOT_METRICS" || true
  cat .flot-work/codex.txt || true
  ;;
esac
exit "$status"
"""
inputs = ["SPEC.md"]
outputs = ["slug.py"]
claims = ["slug.py satisfies every case in the human-written acceptance check"]
verify = "python3 check_slug.py"
verify_inputs = ["check_slug.py"]
