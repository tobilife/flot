# A real agent implements a spec; a check the agent did not write proves it;
# a second agent reviews. This is the flow flot's README numbers come from.
#
#   cd examples/slugify && flot run
#
# Needs `claude` (Claude Code; tested with 2.1.330) and `jq`. Each fresh run
# costs roughly $1.50-2.00 at list price; an unchanged re-run costs nothing.
#
# Agent steps remove their artifact first, so a file left by an earlier run
# can never pass for this run's; report spend even when the agent fails, so
# the cost ceiling sees it; then exit with the agent's status. A rejected
# review is re-rolled on the next run, because only settled receipts are
# reused.
#
# Agent steps run apart from your personal Claude Code setup:
# --setting-sources project skips user settings (plugins, hooks, a personal
# CLAUDE.md), --strict-mcp-config loads no MCP servers, and --tools names the
# only tools the step gets. That keeps a receipt from depending on whose
# machine ran it, and it is most of the cost: one reviewer that wrote NONE cost
# $0.90 with a full personal setup and $0.04 without it. --max-budget-usd stops
# one agent call; the flow's max_cost_usd stops starting new steps.

[flow]
name = "slugify"
description = "Agent implements SPEC.md; check_slug.py proves it; a second agent reviews."
max_cost_usd = 4.0
budget = { timeout_secs = 600, max_inline_bytes = 2048 }

[[step]]
id = "implement"
# --permission-mode acceptEdits lets a headless agent write files; --tools
# names the only tools it gets, and --disallowedTools keeps the acceptance
# check out of its reach. Token counts include cache reads and writes, which
# dominate an agent call.
#
# Up to two attempts: when the check refutes the first, the second gets what
# flot recorded about it ($FLOT_FEEDBACK: the verdict, the check's output and
# the agent's own) and fixes slug.py where the first left it.
attempts = 2
run = """
mkdir -p .flot-work
status=0
prompt="Implement SPEC.md as slug.py. Create or edit only slug.py; do not write tests or other files."
if [ -n "${FLOT_FEEDBACK:-}" ]; then
  prompt="$prompt

Your previous attempt did not pass the acceptance check. What flot recorded about it:
$(cat "$FLOT_FEEDBACK")"
fi
claude -p "$prompt" \
  --setting-sources project --strict-mcp-config --tools Read,Edit,Write \
  --disallowedTools "Read(./check_slug.py)" "Edit(./check_slug.py)" "Write(./check_slug.py)" \
  --permission-mode acceptEdits --max-budget-usd 1.5 --output-format json > .flot-work/implement.json || status=$?
jq '{input_tokens: (.usage.input_tokens + .usage.cache_read_input_tokens + .usage.cache_creation_input_tokens),
     output_tokens: .usage.output_tokens, cost_usd: .total_cost_usd}' .flot-work/implement.json > "$FLOT_METRICS" || true
jq -r .result .flot-work/implement.json || true
exit "$status"
"""
inputs = ["SPEC.md"]
# What the agent hands over. It is kept with the receipt, so a re-run or an
# imported bundle puts back the exact file the check passed on.
outputs = ["slug.py"]
claims = ["slug.py satisfies every case in the human-written acceptance check"]
verify = "python3 check_slug.py"
# Editing the check re-proves the claim; an agent editing the check voids it.
verify_inputs = ["check_slug.py"]

[[step]]
id = "review"
needs = ["implement"]
run = """
mkdir -p .flot-work
rm -f REVIEW.md
status=0
claude -p "Review slug.py against SPEC.md. Write REVIEW.md whose first line is exactly APPROVE or REJECT, followed by your reasons. Do not edit slug.py." \
  --setting-sources project --strict-mcp-config --tools Read,Grep,Glob,Write \
  --permission-mode acceptEdits --max-budget-usd 1.0 --output-format json > .flot-work/review.json || status=$?
jq '{input_tokens: (.usage.input_tokens + .usage.cache_read_input_tokens + .usage.cache_creation_input_tokens),
     output_tokens: .usage.output_tokens, cost_usd: .total_cost_usd}' .flot-work/review.json > "$FLOT_METRICS" || true
cat REVIEW.md || true
exit "$status"
"""
inputs = ["SPEC.md", "slug.py"]
outputs = ["REVIEW.md"]
claims = ["an independent reviewer approved slug.py"]
verify = "head -n 1 REVIEW.md | grep -qx APPROVE"
