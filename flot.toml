# flot's own gate, expressed in flot. Each claim names a command that proves it.
[flow]
name = "flot-self-check"
description = "Build, lint and test flot with every claim bound to a proof command."
budget = { timeout_secs = 1200, max_inline_bytes = 2048 }
# Deliberately sequential: lint and test both drive cargo, which takes a build
# lock, so overlapping them would queue inside cargo instead of saving time.
max_parallel = 1
# Proofs must match main as pushed, so a change cannot also loosen its check.
proofs_from = "origin/main"

# No step key covers the toolchain on PATH. This step runs every time; what
# needs it is reused only while rustc and cargo print what they printed then.
[[step]]
id = "toolchain"
run = "rustc -vV && cargo -V"
always = true

[[step]]
id = "format"
run = "cargo fmt --check"
needs = ["toolchain"]
inputs = ["src/**/*.rs", "tests/**/*.rs"]
claims = ["every source file is rustfmt-clean"]
verify = "cargo fmt --check"

[[step]]
id = "build"
run = "cargo build --all-targets"
needs = ["toolchain", "format"]
inputs = ["src/**/*.rs", "tests/**/*.rs", "Cargo.toml", "Cargo.lock"]
claims = ["the library, binary and test targets compile"]
verify = "cargo build --all-targets --quiet"

[[step]]
id = "lint"
run = "cargo clippy --all-targets -- -D warnings"
needs = ["toolchain", "build"]
inputs = ["src/**/*.rs", "tests/**/*.rs"]
claims = ["clippy reports no warnings on any target"]
verify = "cargo clippy --all-targets -- -D warnings"

# One proof per claim, so a failing test refutes only the claim it shows.
# Each step builds its tests and its proof runs them, once: a failing test
# refutes the claim, and `flot log STEP --proof` prints why.
# Each step is keyed on the files its tests read; tests/readme.rs checks that
# every test target is run by one of them.
[[step]]
id = "unit"
run = "cargo test --no-run --lib --bins"
needs = ["toolchain", "build"]
# The MCP server's tests read the plugin's skill.
inputs = ["src/**/*.rs", "Cargo.toml", "plugins/claude-code/skills/flot/SKILL.md"]
claims = ["the unit suite passes"]
# Doc tests run only when asked for, never with --lib or --test.
verify = "cargo test --quiet --lib --bins && cargo test --quiet --doc"

[[step]]
id = "cli"
run = "cargo test --no-run --test cli --test guard_corpus"
needs = ["toolchain", "build"]
inputs = [
  "src/**/*.rs", "Cargo.toml", "tests/cli.rs", "tests/guard_corpus.rs",
  "tests/guard_corpus.toml", "plugins/claude-code/**/*",
]
claims = ["the end-to-end CLI suite passes"]
verify = "cargo test --quiet --test cli --test guard_corpus"
held = ["tests/**"]

[[step]]
id = "rules"
run = "cargo test --no-run --test architecture --test readme"
needs = ["toolchain", "build"]
# The module rules read src/ and tests/; the release checks read the files that name the
# release or the toolchain, and this flow.
inputs = [
  "src/**/*.rs", "Cargo.toml", "tests/**/*.rs",
  "flot.toml", "README.md", "docs/readme/*.md", "docs/ci.md", "action.yml",
  "plugins/claude-code/.claude-plugin/plugin.json",
  ".claude-plugin/marketplace.json", "rust-toolchain.toml",
  ".github/workflows/*.yml",
]
claims = ["the module rules and the release references hold"]
verify = "cargo test --quiet --test architecture --test readme"
# The tests stay as main has them: a change that passes only a test it
# loosened or deleted proves nothing.
held = ["tests/**"]

# The tests catch every mutant cargo-mutants makes of the code changed since
# main, or a person allowed it in mutants.allow.toml with a reason. The diff
# is of the files git tracks: a new file counts once it is added.
[[step]]
id = "mutants"
run = "cargo mutants --version"
needs = ["unit", "cli", "rules"]
inputs = ["src/**/*.rs", "tests/**/*", "Cargo.toml", "Cargo.lock", "plugins/claude-code/**/*"]
claims = ["the tests catch every mutant of the code changed since main"]
verify = "cargo mutants --version"

[step.mutants]
run = '''
git diff "$FLOT_PROOFS_FROM" -- src > "$FLOT_MUTANTS_DIR/changes.diff" || exit 1
mutants=""
if [ -s "$FLOT_MUTANTS_DIR/changes.diff" ]; then
  mutants=$(cargo mutants --in-diff "$FLOT_MUTANTS_DIR/changes.diff" --exclude-re "tests::" --list) || exit 1
fi
if [ -n "$mutants" ]; then
  cargo mutants --in-diff "$FLOT_MUTANTS_DIR/changes.diff" --exclude-re "tests::" -j 4 --timeout 300 -o "$FLOT_MUTANTS_DIR"
else
  # No change cargo-mutants can mutate, such as one only to text, for
  # which it writes no report: a report of no mutants.
  mkdir "$FLOT_MUTANTS_DIR/mutants.out"
  echo '{"schemaVersion": "1", "thresholds": {"high": 80, "low": 60}, "files": {}}' > "$FLOT_MUTANTS_DIR/mutants.out/outcomes.json"
fi
'''
report = "mutants.out/outcomes.json"
allow = "mutants.allow.toml"
