# Every way of changing what proves the work that `flot guard` has been
# probed with, run by tests/guard_corpus.rs against one project:
#
#   flot.toml        proofs: check.sh, tests/accept.sh
#   check.sh         changed in the working tree since the last commit,
#                    whose parent holds another check.sh
#   tests/accept.sh
#   .github/workflows/ci.yml, .claude/settings.json, .git/config
#   pkg/flot.toml    a flow of its own, with no proofs
#   pkg/.claude/settings.json
#   alias.sh -> check.sh, t -> tests   committed links
#   hard.sh          a hard link to check.sh, ignored by git
#   .flot/           the store, ignored by git
#   p.diff           a patch to check.sh
#   scripts/         ok.sh, bad.sh (rm check.sh), cdbad.sh (cd tests, rm
#                    accept.sh), nested.sh (sh scripts/bad.sh), plain (rm
#                    check.sh, no #! line), bad.py and bad.js (write
#                    check.sh), tool (#!/usr/bin/env python3, writes
#                    tests/accept.sh), sources.sh and sourcesbad.sh
#                    (`. "$(dirname "$0")/` ok.sh or bad.sh), clean.sh
#                    (`rm -rf "$DIR/build"`, DIR its own directory)
#   wipe.sh          `cd "$(dirname "$0")" && rm -rf tests`
#   outer.sh         `. scripts/inner.sh`, which removes
#                    `"$(dirname "$0")/check.sh"`
#   build.ps1, bad.ps1 (Remove-Item check.sh), big.sh (over 1 MiB)
#   branch weak      check.sh made to pass whatever
#   branch other     a change to notes.md only
#   ~ (a temporary home) with .claude/settings.json and .claude/plugins/p,
#                    and .config/flot with signing.key, host.secret and
#                    signing.pub
#
# shell     "sh" or "powershell": `command` is a command line, run with
#           `flot guard --json --command` (and `--powershell`) from the
#           project. "hook": `command` is a Claude Code PreToolUse
#           payload, with {dir} for the project and {home} for the home,
#           piped to `flot guard --hook`.
# protects  What the row would change that the guard must name: a path or
#           a refused command as `flot guard` names it, found in its
#           output's paths or in a reason ("it leads to check.sh: ...").
#           For a hook row, text the denial must hold.
# status    closed     refused, naming all of `protects`.
#           allowed    not refused at all: refusing it would be wrong.
#           open       a hole: not refused, though it could be.
#           inherent   a hole no reading of a command line can close.
#           When an open row is closed, the test fails until its status
#           says so.

# --- Wrappers, compound commands and quoting

[[row]]
shell = "sh"
command = "sed -i 's/1/0/' check.sh"
protects = ["check.sh"]
status = "closed"
note = "the plain case"

[[row]]
shell = "sh"
command = "if true; then rm check.sh; fi"
protects = ["check.sh"]
status = "closed"
note = "a command inside if"

[[row]]
shell = "sh"
command = "for f in 1; do sed -i s/1/0/ check.sh; done"
protects = ["check.sh"]
status = "closed"
note = "a command inside a loop"

[[row]]
shell = "sh"
command = "{ rm check.sh; }"
protects = ["check.sh"]
status = "closed"
note = "a brace group"

[[row]]
shell = "sh"
command = "! rm check.sh"
protects = ["check.sh"]
status = "closed"
note = "a negated command"

[[row]]
shell = "sh"
command = "eval rm check.sh"
protects = ["check.sh"]
status = "closed"
note = "eval"

[[row]]
shell = "sh"
command = "bash -c 'rm check.sh'"
protects = ["check.sh"]
status = "closed"
note = "a shell given a command line"

[[row]]
shell = "sh"
command = "timeout 5 rm check.sh"
protects = ["check.sh"]
status = "closed"
note = "a wrapper"

[[row]]
shell = "sh"
command = "sudo -u root rm check.sh"
protects = ["check.sh"]
status = "closed"
note = "a wrapper with an option that takes a value"

[[row]]
shell = "sh"
command = "echo \"$(rm check.sh)\""
protects = ["check.sh"]
status = "closed"
note = "a command substitution in quotes"

[[row]]
shell = "sh"
command = "echo 'exit 0' >& check.sh"
protects = ["check.sh"]
status = "closed"
note = "the >& redirection"

[[row]]
shell = "sh"
command = "echo 'exit 0' > $'check.sh'"
protects = ["check.sh"]
status = "closed"
note = "ANSI-C quoting"

[[row]]
shell = "sh"
command = "# it doesn't pass yet\nsed -i 's/1/0/' check.sh"
protects = ["check.sh"]
status = "closed"
note = "a comment with a quote before the command"

[[row]]
shell = "sh"
command = "cat <<EOF\n$(rm check.sh)\nEOF"
protects = ["check.sh"]
status = "closed"
note = "a command substitution in a here-document"

[[row]]
shell = "sh"
command = "x=$((1<<4))\nrm check.sh"
protects = ["check.sh"]
status = "closed"
note = "arithmetic with << before the command"

[[row]]
shell = "sh"
command = "xargs rm <<< check.sh"
protects = ["check.sh"]
status = "closed"
note = "xargs given the file in a here-string"

[[row]]
shell = "sh"
command = "chronic rm check.sh"
protects = ["check.sh"]
status = "open"
note = "a wrapper the reader does not know (moreutils' chronic) runs its arguments as a command"

[[row]]
shell = "sh"
command = "strace -f rm check.sh"
protects = ["check.sh"]
status = "open"
note = "a tracer, with an option, runs its arguments as a command"

[[row]]
shell = "sh"
command = "ltrace rm check.sh"
protects = ["check.sh"]
status = "open"
note = "a library tracer runs its arguments as a command"

[[row]]
shell = "sh"
command = "unbuffer rm check.sh"
protects = ["check.sh"]
status = "open"
note = "expect's unbuffer runs its arguments as a command"

