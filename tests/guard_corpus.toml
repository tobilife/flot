command = "x=$((1<<4))\nrm check.sh"
protects = ["check.sh"]
status = "closed"
note = "arithmetic with << before the command"

[[row]]
shell = "sh"
command = "xargs rm <<< check.sh"
protects = ["check.sh"]
status = "closed"
note = "xargs given the file in a here-string"

