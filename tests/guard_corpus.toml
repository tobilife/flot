command = "echo 'exit 0' > $'check.sh'"
protects = ["check.sh"]
status = "closed"
note = "ANSI-C quoting"

[[row]]
shell = "sh"
command = "# it doesn't pass yet\nsed -i 's/1/0/' check.sh"
protects = ["check.sh"]
status = "closed"
note = "a comment with a quote before the command"

[[row]]
shell = "sh"
command = "cat <<EOF\n$(rm check.sh)\nEOF"
protects = ["check.sh"]
status = "closed"
note = "a command substitution in a here-document"

[[row]]
