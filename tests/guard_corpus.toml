# Every way of changing what proves the work that `flot guard` has been
# probed with, run by tests/guard_corpus.rs against one project:
#
#   flot.toml        proofs: check.sh, tests/accept.sh
#   check.sh         changed in the working tree since the last commit,
#                    whose parent holds another check.sh
#   tests/accept.sh
#   .github/workflows/ci.yml, .claude/settings.json, .git/config
#   pkg/flot.toml    a flow of its own, with no proofs
#   pkg/.claude/settings.json
#   alias.sh -> check.sh, t -> tests   committed links
#   hard.sh          a hard link to check.sh, ignored by git
#   .flot/           the store, ignored by git
#   p.diff           a patch to check.sh
#   branch weak      check.sh made to pass whatever
#   branch other     a change to notes.md only
#   ~ (a temporary home) with .claude/settings.json and .claude/plugins/p
#
# shell     "sh" or "powershell": `command` is a command line, run with
#           `flot guard --json --command` (and `--powershell`) from the
#           project. "hook": `command` is a Claude Code PreToolUse
#           payload, with {dir} for the project and {home} for the home,
#           piped to `flot guard --hook`.
# protects  What the row would change that the guard must name: a path or
#           a refused command as `flot guard` names it, found in its
#           output's paths or in a reason ("it leads to check.sh: ...").
#           For a hook row, text the denial must hold.
# status    closed     refused, naming all of `protects`.
#           allowed    not refused at all: refusing it would be wrong.
#           open       a hole: not refused, though it could be.
#           inherent   a hole no reading of a command line can close.
#           When an open row is closed, the test fails until its status
#           says so.

# --- Wrappers, compound commands and quoting

[[row]]
shell = "sh"
command = "sed -i 's/1/0/' check.sh"
protects = ["check.sh"]
status = "closed"
note = "the plain case"

[[row]]
shell = "sh"
command = "if true; then rm check.sh; fi"
protects = ["check.sh"]
status = "closed"
note = "a command inside if"

[[row]]
shell = "sh"
command = "for f in 1; do sed -i s/1/0/ check.sh; done"
protects = ["check.sh"]
status = "closed"
note = "a command inside a loop"

[[row]]
shell = "sh"
command = "{ rm check.sh; }"
protects = ["check.sh"]
status = "closed"
note = "a brace group"

[[row]]
shell = "sh"
command = "! rm check.sh"
protects = ["check.sh"]
status = "closed"
note = "a negated command"

[[row]]
shell = "sh"
command = "eval rm check.sh"
protects = ["check.sh"]
status = "closed"
note = "eval"

[[row]]
shell = "sh"
command = "bash -c 'rm check.sh'"
protects = ["check.sh"]
status = "closed"
note = "a shell given a command line"

[[row]]
shell = "sh"
command = "timeout 5 rm check.sh"
protects = ["check.sh"]
status = "closed"
note = "a wrapper"

[[row]]
shell = "sh"
command = "sudo -u root rm check.sh"
protects = ["check.sh"]
status = "closed"
note = "a wrapper with an option that takes a value"

[[row]]
shell = "sh"
command = "echo \"$(rm check.sh)\""
protects = ["check.sh"]
status = "closed"
note = "a command substitution in quotes"

[[row]]
