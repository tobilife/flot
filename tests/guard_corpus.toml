[[row]]
shell = "sh"
command = "echo 'exit 0' > alias.sh"
protects = ["check.sh"]
status = "closed"
note = "a link to a proof"

[[row]]
shell = "sh"
command = "rm t/accept.sh"
protects = ["tests/accept.sh"]
status = "closed"
note = "a link to the directory a proof is in"

[[row]]
shell = "sh"
command = "echo 'exit 0' > hard.sh"
protects = ["check.sh"]
status = "closed"
note = "a hard link to a proof"

[[row]]
shell = "sh"
command = "cp /tmp/x tests/../check.sh"
protects = ["check.sh"]
status = "closed"
note = ".. in a path"

[[row]]
shell = "sh"
command = "cd tests && rm accept.sh"
protects = ["tests/accept.sh"]
status = "closed"
note = "cd before the command"

[[row]]
shell = "sh"
command = "cd pkg && rm ../check.sh"
protects = ["check.sh"]
status = "closed"
note = "from a nested flow, a proof of the flow above"

[[row]]
shell = "sh"
command = "f=check.sh; rm $f"
protects = ["check.sh"]
status = "closed"
note = "a variable the command line sets"

[[row]]
shell = "sh"
command = "python3 -c \"open('check.sh','w').write('exit 0')\""
protects = ["check.sh"]
status = "closed"
note = "a program that writes the file in its own language: its code names it"

[[row]]
shell = "sh"
command = "sh -c \"$(printf 'rm che%s' ck.sh)\""
protects = ["sh $(..)"]
status = "closed"
note = "a command line built when it runs: what the shell runs cannot be read, so it is refused"

# --- Variables the command line sets

[[row]]
shell = "sh"
command = "f=check.sh && rm \"$f\""
protects = ["check.sh"]
status = "closed"
note = "a variable set before &&, used quoted"

[[row]]
shell = "sh"
command = "f=check.sh\nrm ${f}"
protects = ["check.sh"]
status = "closed"
note = "a variable set on the line before, used as ${f}"

[[row]]
shell = "sh"
command = "d=tests; f=$d/accept.sh; rm $f"
protects = ["tests/accept.sh"]
status = "closed"
note = "a variable built from another"

[[row]]
shell = "sh"
command = "export f=check.sh; bash -c 'rm $f'"
protects = ["check.sh"]
status = "closed"
note = "an exported variable a shell it starts sees"

[[row]]
shell = "sh"
command = "(f=check.sh; rm $f)"
protects = ["check.sh"]
status = "closed"
note = "a variable set in a subshell, used there"

[[row]]
shell = "sh"
command = "{ f=check.sh; }; rm $f"
protects = ["check.sh"]
status = "closed"
note = "a brace group shares the variables of the line"

[[row]]
shell = "sh"
command = "for f in notes.md check.sh; do rm $f; done"
protects = ["check.sh"]
status = "closed"
note = "a loop variable"

[[row]]
shell = "sh"
command = "f=check.sh rm $f"
protects = []
status = "allowed"
note = "an assignment before a command is its environment, not its words: $f is empty"

[[row]]
shell = "sh"
command = "f=check.sh true; rm $f"
protects = []
status = "allowed"
note = "nor after it: $f is still empty"

[[row]]
shell = "sh"
command = "f=notes.md; rm $f"
protects = []
status = "allowed"
note = "a variable that names nothing guarded"

[[row]]
shell = "sh"
command = "f=check.sh; sh -c 'rm $f'"
protects = ["check.sh"]
status = "closed"
note = "refused, though the shell it starts does not see $f: a variable is put in wherever its name is, quoted or not"

[[row]]
shell = "sh"
command = "f=$(cat name.txt); rm $f"
protects = ["check.sh"]
status = "closed"
note = "a variable set to what a command prints may name anything, so every guarded file"

[[row]]
shell = "sh"
command = "read f < name.txt; rm $f"
protects = ["check.sh"]
status = "inherent"
note = "a variable set from what a program reads: no reading of the line can know it"

