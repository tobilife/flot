protects = ["check.sh is protected"]
status = "closed"
note = "half an emoji, which no JSON parser takes"

[[row]]
shell = "hook"
command = 'not json'
protects = ["this call cannot be judged"]
status = "closed"
note = "a payload that does not parse"

[[row]]
shell = "hook"
command = '{"cwd":"{dir}","tool_name":"Edit","tool_input":{}}'
protects = ["this call cannot be judged"]
